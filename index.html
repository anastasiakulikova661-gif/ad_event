<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Додати подію</title>
<style>
  :root {
    --bg: #F6FAFF;
    --card: #FFFFFF;
    --text: #173B64;
    --text-muted: #5C7699;
    --accent: #A3C4EB;
    --accent-strong: #173B64;
    --warn: #FFDE70;
    --border: #E1EAF5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1B2E;
      --card: #16263F;
      --text: #EAF1FB;
      --text-muted: #9FB3CC;
      --accent: #2E4A73;
      --accent-strong: #A3C4EB;
      --warn: #FFDE70;
      --border: #223350;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F1B2E;
    --card: #16263F;
    --text: #EAF1FB;
    --text-muted: #9FB3CC;
    --accent: #2E4A73;
    --accent-strong: #A3C4EB;
    --warn: #FFDE70;
    --border: #223350;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding-top: calc(24px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px 22px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    box-shadow: 0 8px 30px rgba(23,59,100,0.08);
  }
  .icon { font-size: 40px; margin-bottom: 6px; }
  h1 { color: var(--text); font-size: 20px; margin: 0 0 6px; }
  p.sub { color: var(--text-muted); font-size: 14px; margin: 0 0 24px; line-height: 1.4; }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 15px 18px;
    border-radius: 14px;
    border: none;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 12px;
    text-decoration: none;
    font-family: inherit;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn:hover { opacity: 0.92; }
  .btn-main { background: var(--accent-strong); color: #fff; }
  .btn-light { background: var(--card); color: var(--text); border: 1.5px solid var(--border); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .btn-main { color: #0F1B2E; }
  }
  :root[data-theme="dark"] .btn-main { color: #0F1B2E; }
  #status { color: var(--text-muted); font-size: 14px; margin: 4px 0 14px; min-height: 18px; }
  #status.err { color: #C0392B; }
  #result { display: none; text-align: left; margin-top: 8px; }
  #result .ev {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
  }
  #result .ev b { font-size: 16px; display: block; margin-bottom: 4px; }
  .hint { margin-top: 18px; font-size: 12px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">📅</div>
    <h1>Додати подію в календар</h1>
    <p class="sub">Сфотографуйте запис у календарі, і подію буде розпізнано автоматично.</p>

    <input type="file" id="photo" accept="image/*" hidden>
    <button class="btn btn-main" id="btn">📷 Додати подію з фото</button>
    <div id="status"></div>

    <div id="result">
      <div class="ev" id="evBox"></div>
      <a class="btn btn-main" id="gBtn" href="#" target="_blank" rel="noopener">📆 Додати в Google Calendar</a>
    </div>

    <a class="btn btn-light" href="https://calendar.google.com/calendar/render?action=TEMPLATE" target="_blank" rel="noopener">
      ✍️ Додати вручну
    </a>

    <div class="hint">Сторінку відкрито з друкованого AR-календаря ХНЕУ ім. С. Кузнеця</div>
  </div>

<script>
  var WORKER = "https://nameless-flower-6807.7401146.workers.dev";
  var TZ = "Europe/Kyiv";

  var photo = document.getElementById("photo");
  var btn = document.getElementById("btn");
  var statusEl = document.getElementById("status");
  var result = document.getElementById("result");
  var evBox = document.getElementById("evBox");
  var gBtn = document.getElementById("gBtn");

  btn.addEventListener("click", function () { photo.click(); });

  function setStatus(text, isErr) {
    statusEl.textContent = text;
    statusEl.className = isErr ? "err" : "";
  }

  // Стискає фото до 1500px, повертає чистий base64 JPEG
  function toBase64(file) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () {
        var k = Math.min(1, 1500 / Math.max(img.width, img.height));
        var c = document.createElement("canvas");
        c.width = Math.round(img.width * k);
        c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL("image/jpeg", 0.85).split(",")[1]);
      };
      img.onerror = function () { reject(new Error("Не вдалося прочитати фото")); };
      img.src = URL.createObjectURL(file);
    });
  }

  function p2(n) { return String(n).padStart(2, "0"); }

  // Повертає "YYYYMMDD" або "YYYYMMDDTHHMM00" зі зсувом у хвилинах
  function stamp(date, time, addMin) {
    var d = date.split("-").map(Number);
    var t = time ? time.split(":").map(Number) : [0, 0];
    var dt = new Date(Date.UTC(d[0], d[1] - 1, d[2], t[0], t[1] + (addMin || 0)));
    var day = dt.getUTCFullYear() + p2(dt.getUTCMonth() + 1) + p2(dt.getUTCDate());
    if (!time) return day;
    return day + "T" + p2(dt.getUTCHours()) + p2(dt.getUTCMinutes()) + "00";
  }

  function googleUrl(ev) {
    var dates;
    if (ev.start_time) {
      var s = stamp(ev.date, ev.start_time, 0);
      var e = ev.end_time ? stamp(ev.date, ev.end_time, 0) : stamp(ev.date, ev.start_time, 60);
      if (e <= s) e = stamp(ev.date, ev.end_time, 1440); // подія через північ
      dates = s + "/" + e;
    } else {
      // подія на весь день: кінець ексклюзивний
      dates = stamp(ev.date, null, 0) + "/" + stamp(ev.date.replace(/-\d\d$/, function (m) { return m; }), null, 0);
      var d = ev.date.split("-").map(Number);
      var next = new Date(Date.UTC(d[0], d[1] - 1, d[2] + 1));
      dates = stamp(ev.date, null, 0) + "/" +
        next.getUTCFullYear() + p2(next.getUTCMonth() + 1) + p2(next.getUTCDate());
    }
    return "https://calendar.google.com/calendar/render?" + new URLSearchParams({
      action: "TEMPLATE",
      text: ev.title || "Подія",
      dates: dates,
      details: ev.description || "",
      location: ev.location || "",
      ctz: TZ
    });
  }

  function show(ev) {
    if (!ev.date || !/^\d{4}-\d{2}-\d{2}$/.test(ev.date)) {
      throw new Error("Не вдалося визначити дату події. Спробуйте чіткіше фото.");
    }
    evBox.textContent = "";
    var title = document.createElement("b");
    title.textContent = ev.title || "Подія";
    evBox.appendChild(title);
    var when = ev.date + (ev.start_time ? " " + ev.start_time : "") + (ev.end_time ? "–" + ev.end_time : "");
    evBox.appendChild(document.createTextNode(when));
    if (ev.location) {
      evBox.appendChild(document.createElement("br"));
      evBox.appendChild(document.createTextNode("📍 " + ev.location));
    }
    if (ev.description) {
      evBox.appendChild(document.createElement("br"));
      evBox.appendChild(document.createTextNode(ev.description));
    }
    gBtn.href = googleUrl(ev);
    result.style.display = "block";
  }

  photo.addEventListener("change", async function () {
    if (!photo.files[0]) return;
    result.style.display = "none";
    setStatus("Розпізнаю…", false);
    try {
      var b64 = await toBase64(photo.files[0]);
      var r = await fetch(WORKER, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image_base64: b64 })
      });
      var ev = await r.json();
      if (ev.error) throw new Error(ev.error);
      show(ev);
      setStatus("Готово! Перевірте дані та збережіть подію.", false);
    } catch (err) {
      setStatus("Помилка: " + err.message, true);
    }
    photo.value = "";
  });
</script>
</body>
</html>
